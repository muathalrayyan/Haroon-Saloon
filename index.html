<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صالون هارون الرشيد - نظام الكاونتر المتقدم</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
      }

      body {
        background-color: #0d0d0d;
        color: #e0e0e0;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      #bgCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }

      .app-container {
        width: 100%;
        max-width: 950px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .logo {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 3px solid #c0c0c0;
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        margin: 0 auto 10px auto;
        display: block;
        object-fit: cover;
        object-position: 45% center;
        transform: scale(1.1);
        transition: transform 0.3s ease;
      }

      .logo:hover {
        transform: scale(1.15);
      }

      h1 {
        margin: 5px 0;
        color: #ffffff;
        font-size: 26px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }

      .subtitle {
        color: #aaa;
        font-size: 14px;
      }

      .controls-panel {
        background: rgba(26, 26, 26, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 15px 20px;
        width: 100%;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .control-group label {
        font-size: 14px;
        color: #c0c0c0;
        font-weight: bold;
      }

      .control-group select {
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #00ffcc;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        cursor: pointer;
        text-align: center;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 15px;
        width: 100%;
        margin-bottom: 25px;
      }

      .card {
        background: rgba(30, 30, 30, 0.9);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* توسيط كرت العطور الفخمة (الكرت الـ 11) */
      .card:last-child:nth-child(11) {
        grid-column: 1 / -1;
        max-width: 250px;
        justify-self: center;
        width: 100%;
      }

      .card:hover {
        border-color: #00ffcc;
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 255, 204, 0.15);
      }

      .card:active {
        transform: scale(0.95);
        background: #2a2a2a;
      }

      .card-title {
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 8px;
      }

      .card-price {
        color: #c0c0c0;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .badge {
        background: #222;
        color: #00ffcc;
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 13px;
        border: 1px solid #00ffcc33;
      }

      .summary-box {
        width: 100%;
        background: rgba(26, 26, 26, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid #444;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }

      .totals-row {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
        border-bottom: 1px solid #333;
        padding-bottom: 15px;
      }

      .total-item {
        font-size: 16px;
        font-weight: bold;
        background: #222;
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid #333;
      }

      .total-item span {
        color: #00ffcc;
      }

      .section-title {
        color: #ffffff;
        font-size: 17px;
        margin: 5px 0 10px 0;
        text-align: center;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      .report-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
      }

      .report-table th,
      .report-table td {
        border: 1px solid #333;
        padding: 10px;
        text-align: center;
        font-size: 14px;
      }

      .report-table th {
        background-color: #222;
        color: #00ffcc;
      }

      .report-table td {
        background-color: #1a1a1a;
      }

      .btn-reset {
        background: #990000;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        align-self: center;
        transition: background 0.2s ease;
      }

      .btn-reset:hover {
        background: #cc0000;
      }
    </style>
  </head>
  <body>
    <canvas id="bgCanvas"></canvas>

    <div class="app-container">
      <div class="header">
        <img src="logo.jpeg" alt="Haroun Logo" class="logo" />
        <h1>👑 صالون هارون الرشيد</h1>
        <div class="subtitle">الجبيهة - عمان</div>
      </div>

      <!-- لوحة الاختيارات مع أسماء الحلاقين الجدد -->
      <div class="controls-panel">
        <div class="control-group">
          <label>اختر الحلاق الحالي:</label>
          <select id="barberSelect"></select>
        </div>

        <div class="control-group">
          <label>طريقة الدفع:</label>
          <select id="payMethodSelect">
            <option value="cash">كاش (Cash)</option>
            <option value="visa">فيزا (Visa)</option>
          </select>
        </div>
      </div>

      <div class="grid-container" id="servicesContainer"></div>

      <div class="summary-box">
        <div class="totals-row">
          <div class="total-item">
            دخل الكاش: <span id="cashTotal">0</span> د.أ
          </div>
          <div class="total-item">
            دخل الفيزا: <span id="visaTotal">0</span> د.أ
          </div>
          <div class="total-item">
            إجمالي اليوم: <span id="grandTotal">0</span> د.أ
          </div>
        </div>

        <div class="section-title">📊 ملخص الأرباح والنسب (40% / 60%)</div>
        <div class="table-responsive">
          <table class="report-table">
            <thead>
              <tr>
                <th>الحلاق</th>
                <th>إجمالي العمليات</th>
                <th>المبلغ الإجمالي</th>
                <th>حصة الحلاق (40%)</th>
                <th>حصة الصالون (60%)</th>
              </tr>
            </thead>
            <tbody id="barbersSummaryBody"></tbody>
          </table>
        </div>

        <div class="section-title">📝 تفاصيل أداء كل حلاق بالخدمات</div>
        <div class="table-responsive">
          <table class="report-table">
            <thead>
              <tr id="detailsHeaderRow">
                <th>الخدمة / الباقة</th>
                <!-- سيتم تعبئة أسرّة الأسماء ديناميكياً -->
              </tr>
            </thead>
            <tbody id="barbersDetailsBody"></tbody>
          </table>
        </div>

        <button class="btn-reset" onclick="resetDay()">
          تصفير العداد لليوم جديد
        </button>
      </div>
    </div>

    <script>
      const services = [
        { id: "s1", name: "باقة الطالب", price: 8 },
        { id: "s2", name: "باقة الخريج", price: 10 },
        { id: "s3", name: "باقة هارون الرشيد", price: 15 },
        { id: "s4", name: "باقة العريس", price: 50 },
        { id: "s5", name: "حلاقة شعر", price: 7 },
        { id: "s6", name: "حلاقة ذقن", price: 4 },
        { id: "s7", name: "حلاقة ذقن بخار", price: 5 },
        { id: "s8", name: "سشوار", price: 4 },
        { id: "s9", name: "تنظيف بشرة عميق", price: 25 },
        { id: "s10", name: "مساج كامل", price: 35 },
        { id: "s11", name: "عطور فخمة", price: 10 },
      ];

      // أسماء الحلاقين الجدد
      const barbers = [
        { id: "b1", name: "زيد" },
        { id: "b2", name: "محمد" },
        { id: "b3", name: "أبو صبرة" },
        { id: "b4", name: "عبد الله" },
        { id: "b5", name: "أحمد" },
      ];

      let transactions =
        JSON.parse(localStorage.getItem("haroun_transactions")) || [];

      // تعبئة القائمة المنسدلة بالحلاقين تلقائياً
      function initBarberSelect() {
        const select = document.getElementById("barberSelect");
        select.innerHTML = "";
        barbers.forEach((b) => {
          const opt = document.createElement("option");
          opt.value = b.id;
          opt.innerText = b.name;
          select.appendChild(opt);
        });
      }

      function renderUI() {
        const container = document.getElementById("servicesContainer");
        container.innerHTML = "";

        let cashTotal = 0;
        let visaTotal = 0;
        let serviceCounts = {};

        // تهيئة إحصائيات الحلاقين ديناميكياً
        let barberStats = {};
        barbers.forEach((b) => {
          barberStats[b.id] = { count: 0, total: 0 };
        });

        // مصفوفة التفاصيل
        let detailMatrix = {};
        services.forEach((s) => {
          detailMatrix[s.id] = {};
          barbers.forEach((b) => {
            detailMatrix[s.id][b.id] = 0;
          });
        });

        transactions.forEach((tx) => {
          if (tx.payMethod === "cash") cashTotal += tx.price;
          if (tx.payMethod === "visa") visaTotal += tx.price;

          serviceCounts[tx.serviceId] = (serviceCounts[tx.serviceId] || 0) + 1;

          if (barberStats[tx.barberId]) {
            barberStats[tx.barberId].count += 1;
            barberStats[tx.barberId].total += tx.price;
          }

          if (
            detailMatrix[tx.serviceId] &&
            detailMatrix[tx.serviceId][tx.barberId] !== undefined
          ) {
            detailMatrix[tx.serviceId][tx.barberId] += 1;
          }
        });

        services.forEach((service) => {
          const count = serviceCounts[service.id] || 0;
          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => addTransaction(service.id, service.price);
          card.innerHTML = `
            <div class="card-title">${service.name}</div>
            <div class="card-price">${service.price} د.أ</div>
            <div><span class="badge">العدد: ${count}</span></div>
          `;
          container.appendChild(card);
        });

        document.getElementById("cashTotal").innerText = cashTotal;
        document.getElementById("visaTotal").innerText = visaTotal;
        document.getElementById("grandTotal").innerText = cashTotal + visaTotal;

        // 1. جدول ملخص النسب والأرباح
        const summaryBody = document.getElementById("barbersSummaryBody");
        summaryBody.innerHTML = "";

        barbers.forEach((b) => {
          const stats = barberStats[b.id];
          const barberShare = (stats.total * 0.4).toFixed(2);
          const salonShare = (stats.total * 0.6).toFixed(2);

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><b>${b.name}</b></td>
            <td>${stats.count}</td>
            <td>${stats.total} د.أ</td>
            <td style="color: #00ffcc;">${barberShare} د.أ</td>
            <td style="color: #c0c0c0;">${salonShare} د.أ</td>
          `;
          summaryBody.appendChild(row);
        });

        // 2. تحديث ترويسة وجدول تفاصيل خدمات الحلاقين
        const detailsHeader = document.getElementById("detailsHeaderRow");
        detailsHeader.innerHTML = `<th>الخدمة / الباقة</th>`;
        barbers.forEach((b) => {
          detailsHeader.innerHTML += `<th>${b.name}</th>`;
        });
        detailsHeader.innerHTML += `<th>الإجمالي الكلي</th>`;

        const detailsBody = document.getElementById("barbersDetailsBody");
        detailsBody.innerHTML = "";

        services.forEach((s) => {
          let rowHTML = `<td><b>${s.name}</b></td>`;
          let totalServiceCount = 0;

          barbers.forEach((b) => {
            const bCount = detailMatrix[s.id][b.id] || 0;
            totalServiceCount += bCount;
            rowHTML += `<td>${bCount}</td>`;
          });

          rowHTML += `<td style="color: #00ffcc;"><b>${totalServiceCount}</b></td>`;

          const row = document.createElement("tr");
          row.innerHTML = rowHTML;
          detailsBody.appendChild(row);
        });
      }

      function addTransaction(serviceId, price) {
        const barberId = document.getElementById("barberSelect").value;
        const payMethod = document.getElementById("payMethodSelect").value;

        transactions.push({
          serviceId: serviceId,
          price: price,
          barberId: barberId,
          payMethod: payMethod,
          timestamp: new Date().getTime(),
        });

        localStorage.setItem(
          "haroun_transactions",
          JSON.stringify(transactions),
        );
        renderUI();
      }

      function resetDay() {
        if (confirm("هل أنت تأكد من تصفير جميع العدادات وبداية يوم جديد؟")) {
          transactions = [];
          localStorage.removeItem("haroun_transactions");
          renderUI();
        }
      }

      const canvas = document.getElementById("bgCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let mouse = { x: null, y: null };

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      resizeCanvas();

      class CrownParticle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 12 + 10;
          this.speedY = Math.random() * 0.4 + 0.1;
          this.speedX = Math.random() * 0.2 - 0.1;
          this.opacity = Math.random() * 0.25 + 0.05;
        }

        update() {
          this.y += this.speedY;
          this.x += this.speedX;

          if (mouse.x && mouse.y) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 100) {
              this.x -= dx * 0.03;
              this.y -= dy * 0.03;
            }
          }

          if (this.y > canvas.height) {
            this.y = -20;
            this.x = Math.random() * canvas.width;
          }
        }

        draw() {
          ctx.font = `${this.size}px "Segoe UI Emoji", Arial`;
          ctx.globalAlpha = this.opacity;
          ctx.fillText("👑", this.x, this.y);
          ctx.globalAlpha = 1.0;
        }
      }

      for (let i = 0; i < 35; i++) {
        particles.push(new CrownParticle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      initBarberSelect();
      animate();
      renderUI();
    </script>
  </body>
</html>
